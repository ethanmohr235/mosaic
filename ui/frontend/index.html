<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MonOSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div id="garden-switcher">
    <select id="garden-select"></select>
    <button id="new-garden-btn" title="Create a new garden">+</button>
    <button id="export-garden-btn" title="Export the current garden to a file">Export</button>
    <button id="import-garden-btn" title="Import a garden from a file into a new garden">Import</button>
  </div>
  <div id="topbar-title">MonOSS</div>
  <label id="depth-wrap" title="How far out from the selected mote the graph reaches">
    Depth
    <select id="depth-select">
      <option value="1">1 hop</option>
      <option value="2">2 hops</option>
      <option value="3">3 hops</option>
      <option value="4">4 hops</option>
      <option value="5">5 hops</option>
      <option value="6">6 hops</option>
      <option value="all">Whole garden</option>
    </select>
  </label>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Search motes…" autocomplete="off">
    <div id="search-results" class="hidden"></div>
  </div>
  <button id="run-sim-btn">Run simulation</button>
</header>

<main>
  <div id="cy"></div>

  <div id="empty-state" class="hidden">
    <p>No motes yet in this garden.</p>
    <p>Create one to get started.</p>
  </div>

  <section id="quick-add">
    <h2>New mote</h2>
    <div id="quick-add-rows"></div>
    <button id="add-property-row" type="button">+ add property</button>
    <button id="create-mote-btn" type="button">Create</button>
  </section>

  <aside id="detail-panel" class="hidden">
    <button id="close-panel" title="Close">&times;</button>
    <div id="detail-id"></div>
    <h3>Properties</h3>
    <div id="detail-properties"></div>
    <div id="detail-add-property">
      <input type="text" id="detail-new-key" placeholder="key">
      <input type="text" id="detail-new-value" placeholder="value">
      <button id="detail-add-property-btn" type="button">Add</button>
    </div>
    <h3>Species</h3>
    <div id="detail-species"></div>
    <div id="detail-instance-count"></div>
    <div id="species-picker-wrap" class="hidden">
      <input type="text" id="species-picker-input" placeholder="Search motes…" autocomplete="off">
      <div id="species-picker-results" class="hidden"></div>
    </div>
    <button id="set-species-btn" type="button">Set species…</button>
    <h3>Relationships</h3>
    <div id="detail-relationships"></div>
    <button id="delete-mote-btn" type="button">Delete mote</button>
  </aside>
</main>

<div id="toast" class="hidden"></div>

<script src="vendor/cytoscape.min.js"></script>
<script src="app.js"></script>
</body>
</html>
