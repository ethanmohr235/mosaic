<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MonOSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div id="brand">
    <svg width="22" height="22" viewBox="0 0 128 128" aria-hidden="true">
      <rect width="128" height="128" rx="28" fill="var(--panel)"></rect>
      <line x1="40" y1="44" x2="88" y2="34" stroke="var(--accent)" stroke-width="5"></line>
      <line x1="40" y1="44" x2="70" y2="92" stroke="var(--accent)" stroke-width="5"></line>
      <circle cx="40" cy="44" r="15" fill="var(--accent)"></circle>
      <circle cx="88" cy="34" r="10" fill="var(--fg)"></circle>
      <circle cx="70" cy="92" r="10" fill="var(--fg)"></circle>
    </svg>
    <span id="brand-name">MonOSS</span>
  </div>

  <button id="garden-btn" type="button" title="Manage gardens">
    <span id="garden-label">…</span><span class="caret">⌄</span>
  </button>

  <div class="spacer"></div>

  <button id="search-btn" type="button">
    <span class="search-glyph"></span>
    <span>Search motes…</span>
    <kbd>⌘K</kbd>
  </button>

  <div id="sim-controls">
    <input type="number" id="sim-steps-input" min="1" max="500" value="10" title="Steps to simulate">
    <button id="run-sim-btn" type="button">Run simulation</button>
  </div>
  <button id="export-calendar-btn" type="button">Export to Calendar</button>
</header>

<main>
  <div id="graph-wrap">
    <canvas id="graph"></canvas>
    <div id="select-box" class="hidden"></div>

    <div id="empty-state" class="hidden">
      <p>No motes in this garden yet.</p>
      <p class="muted">Use the + button to create one.</p>
    </div>

    <section id="control-panel">
      <div class="panel-heading">Species</div>
      <div id="legend"></div>

      <div class="panel-heading" id="rel-heading">Relationships</div>
      <div id="rel-filters"></div>

      <div class="panel-divider"></div>
      <label id="depth-row">
        <span>Depth</span>
        <select id="depth-select">
          <option value="1">1 hop</option>
          <option value="2">2 hops</option>
          <option value="3">3 hops</option>
          <option value="4">4 hops</option>
          <option value="5">5 hops</option>
          <option value="6">6 hops</option>
          <option value="all">Whole garden</option>
        </select>
      </label>
      <button id="reset-view-btn" type="button" class="linkish">⤢ Reset view</button>
    </section>

    <div id="quick-add-wrap">
      <section id="quick-add" class="hidden">
        <div class="panel-title">New mote</div>
        <div id="species-chips"></div>
        <div id="quick-add-rows"></div>
        <div class="row-actions">
          <button id="add-property-row" type="button" class="ghost">+ add property</button>
          <div class="spacer"></div>
          <button id="create-mote-btn" type="button" class="primary">Create</button>
        </div>
      </section>
      <button id="quick-add-btn" type="button" title="New mote">+</button>
    </div>

    <aside id="detail-panel" class="hidden">
      <div id="detail-resize-handle" title="Drag to resize"></div>
      <button id="close-panel" type="button" title="Close">×</button>

      <div id="detail-single">
        <div id="detail-type">
          <span id="detail-dot"></span><span id="detail-type-label"></span>
        </div>
        <div id="detail-title"></div>
        <div id="detail-id"></div>

        <div class="panel-heading">Properties</div>
        <div id="detail-properties"></div>
        <div id="detail-add-property">
          <input type="text" id="detail-new-key" placeholder="key">
          <input type="text" id="detail-new-value" placeholder="value">
          <button id="detail-add-property-btn" type="button">Add</button>
        </div>

        <div class="panel-heading">Species</div>
        <div id="detail-species"></div>
        <div id="detail-species-actions">
          <button id="set-species-btn" type="button" class="ghost">Set species…</button>
          <button id="new-instance-btn" type="button" class="ghost hidden">+ New instance</button>
        </div>
        <div id="species-picker-wrap" class="hidden">
          <input type="text" id="species-picker-input" placeholder="Search for a species…" autocomplete="off">
          <div id="species-picker-results"></div>
        </div>
        <div id="detail-instance-count"></div>

        <div class="panel-heading">Relationships</div>
        <div id="detail-relationships"></div>
        <button id="connect-btn" type="button" class="ghost wide">Connect to…</button>

        <button id="delete-mote-btn" type="button" class="danger wide">Delete mote</button>
      </div>

      <div id="detail-multi">
        <div id="detail-multi-count"></div>
        <div class="panel-heading">Species</div>
        <div id="detail-multi-species"></div>
        <button id="delete-selection-btn" type="button" class="danger wide">Delete selected</button>
      </div>

      <div id="detail-relationship">
        <div class="panel-heading">Relationship</div>
        <div id="detail-rel-endpoints">
          <div id="detail-rel-from" class="rel-endpoint"></div>
          <div id="detail-rel-type-row"></div>
          <div id="detail-rel-to" class="rel-endpoint"></div>
        </div>
        <button id="delete-relationship-btn" type="button" class="danger wide">Delete relationship</button>
      </div>
    </aside>
  </div>
</main>

<div id="context-menu" class="hidden menu"></div>

<div id="search-overlay" class="hidden">
  <div id="search-modal">
    <input type="text" id="search-input" placeholder="Search motes and properties…" autocomplete="off">
    <div id="search-species-chips" class="chip-row"></div>
    <div id="search-rel-chips" class="chip-row"></div>
    <div id="search-results"></div>
    <div id="search-footer">
      <span>↑↓ navigate</span><span>↵ select</span><span>esc close</span>
    </div>
  </div>
</div>

<div id="gardens-overlay" class="hidden">
  <div id="gardens-modal">
    <div class="panel-title">Gardens</div>
    <div id="gardens-list"></div>
    <div id="gardens-modal-actions">
      <button id="new-garden-btn" type="button" class="ghost">+ New garden…</button>
      <div class="spacer"></div>
      <button id="import-garden-btn" type="button" class="ghost">Import…</button>
    </div>
  </div>
</div>

<div id="simulation-overlay" class="hidden">
  <div id="simulation-modal">
    <div class="panel-title">Simulation preview</div>
    <div id="sim-step-summary"></div>
    <div id="sim-step-error" class="hidden"></div>
    <input type="range" id="sim-step-slider" min="0" step="1" value="0">
    <div id="sim-step-label"></div>
    <div id="sim-step-changes"></div>
    <div id="sim-modal-actions">
      <button id="sim-cancel-btn" type="button" class="ghost">Cancel</button>
      <div class="spacer"></div>
      <button id="sim-commit-btn" type="button" class="primary">Commit this step</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
