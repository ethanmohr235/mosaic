# Self-hosted sync server (sync_server/): one person's machines, every
# garden (docs/architecture.md -> Sync).
#
# Put POSTGRES_PASSWORD and MONOSS_SYNC_TOKEN in a .env file next to this
# compose file (generate the token with:
# `python3 -c "import secrets; print(secrets.token_urlsafe(32))"`), then
# `docker compose up -d`. The server migrates its own schema on start; back
# its database up first when upgrading:
# `docker compose exec postgres pg_dump -U monoss monoss_sync > backup.sql`.
#
# MONOSS_SYNC_TOKEN is the account's secret. It is asked for once per
# machine, by `monoss sync login http://your-host:8080`, which pairs that
# machine and hands it a token of its own (revoke one with `sync revoke`).
# The container speaks plain HTTP: keep it on a private network (a
# tailnet), or put a TLS-terminating proxy (`tailscale serve`) in front.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monoss_sync
      POSTGRES_USER: monoss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
    volumes:
      - sync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monoss"]
      interval: 5s
      timeout: 3s
      retries: 5

  sync-server:
    build:
      context: .
      dockerfile: sync_server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monoss:${POSTGRES_PASSWORD}@postgres:5432/monoss_sync
      MONOSS_SYNC_TOKEN: "${MONOSS_SYNC_TOKEN:?generate one with python3 -c \"import secrets; print(secrets.token_urlsafe(32))\"}"
    ports:
      - "8080:8080"

volumes:
  sync_pgdata:
